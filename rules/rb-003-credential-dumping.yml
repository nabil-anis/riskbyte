id: rb-003
title: Credential dumping tool signature
severity: critical
description: Command line contains well-known credential dumping keywords.
tags: [credential-access, T1003]
any_of:
  - {cmdline|contains: sekurlsa}
  - {cmdline|contains: lsass.dmp}
  - {cmdline|re: 'procdump.*lsass'}
action: {kind: isolate_host, target_field: host}
